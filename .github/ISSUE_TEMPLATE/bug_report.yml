name: Bug report
description: Report a reproducible issue without private Codex data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, auth.json, session JSONL files, database files, or conversation content. 请勿提交 API Key、auth.json、会话 JSONL、数据库文件或对话内容。"
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider type
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery or rollback result
